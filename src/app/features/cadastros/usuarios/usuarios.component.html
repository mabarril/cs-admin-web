<div class="px-4 py-6 sm:px-6 lg:px-8">
    <div class="sm:flex sm:items-center sm:justify-between mb-8">
        <div>
            <h1 class="text-2xl font-bold leading-7 text-gray-900 sm:truncate sm:tracking-tight">
                Cadastro de Novos Usuários
            </h1>
            <p class="mt-1 text-sm text-gray-500">
                Preencha os dados abaixo para enviar um convite de acesso à plataforma.
            </p>
        </div>
    </div>

    <div class="form-container">
        <div *ngIf="successMessage" class="alert alert-success">
            {{ successMessage }}
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger">
            {{ errorMessage }}
        </div>

        <form [formGroup]="usuarioForm" (ngSubmit)="onSubmit()">
            <!-- Nome Completo -->
            <div class="form-group">
                <label for="fullName" class="form-label">Nome Completo</label>
                <input id="fullName" type="text" formControlName="fullName" class="form-input"
                    placeholder="Ex: João da Silva">
                <div *ngIf="usuarioForm.get('fullName')?.touched && usuarioForm.get('fullName')?.invalid"
                    class="error-text">
                    <span *ngIf="usuarioForm.get('fullName')?.errors?.['required']">Nome é obrigatório.</span>
                    <span *ngIf="usuarioForm.get('fullName')?.errors?.['minlength']">Mínimo de 3 caracteres.</span>
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email" class="form-label">E-mail</label>
                <input id="email" type="email" formControlName="email" class="form-input"
                    placeholder="Ex: joao@email.com">
                <div *ngIf="usuarioForm.get('email')?.touched && usuarioForm.get('email')?.invalid" class="error-text">
                    <span *ngIf="usuarioForm.get('email')?.errors?.['required']">E-mail é obrigatório.</span>
                    <span *ngIf="usuarioForm.get('email')?.errors?.['email']">E-mail inválido.</span>
                </div>
            </div>

            <!-- Senha Provisória -->
            <div class="form-group">
                <label for="password" class="form-label">Senha Provisória</label>
                <input id="password" type="password" formControlName="password" class="form-input"
                    placeholder="Mínimo de 6 caracteres">
                <div *ngIf="usuarioForm.get('password')?.touched && usuarioForm.get('password')?.invalid"
                    class="error-text">
                    <span *ngIf="usuarioForm.get('password')?.errors?.['required']">Senha é obrigatória.</span>
                    <span *ngIf="usuarioForm.get('password')?.errors?.['minlength']">Mínimo de 6 caracteres.</span>
                </div>
            </div>

            <!-- Papel (Role) -->
            <div class="form-group">
                <label for="role" class="form-label">Perfil de Acesso</label>
                <select id="role" formControlName="role" class="form-select">
                    <option *ngFor="let role of availableRoles" [value]="role.id">
                        {{ role.name }}
                    </option>
                </select>
                <div *ngIf="usuarioForm.get('role')?.touched && usuarioForm.get('role')?.invalid" class="error-text">
                    <span *ngIf="usuarioForm.get('role')?.errors?.['required']">Perfil é obrigatório.</span>
                </div>
            </div>

            <!-- Botão Enviar -->
            <div class="mt-6">
                <button type="submit" class="btn-submit" [disabled]="isLoading">
                    <span *ngIf="isLoading">Aguarde...</span>
                    <span *ngIf="!isLoading">Cadastrar Usuário</span>
                </button>
            </div>
        </form>
    </div>
</div>
